<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧情选择</title>
<style>
  :root {
    --app-bg: #f4f6fa;
    --panel-bg: #ffffff;
    --panel-border: #e5eaf2;
    --panel-shadow: 0 8px 24px rgb(31 35 41 / 6%);
    --text-primary: #1d2129;
    --text-secondary: #86909c;
    --brand: #1677ff;
    --brand-soft: #e8f3ff;
    --danger-soft: #fff1f0;
    --radius-lg: 10px;
    --radius-md: 7px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    background: rgba(15, 20, 30, 0.62);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    color: var(--text-primary);
  }
  ::selection { color: #0e3b78; background: #cfe5ff; }

  .panel {
    width: 720px;
    max-height: 82dvh;
    background: var(--panel-bg);
    border-radius: var(--radius-lg);
    box-shadow: var(--panel-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .title { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .count { font-size: 12px; color: var(--text-secondary); }

  .crumbs {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 20px 12px;
    font-size: 12px;
    color: #687b91;
  }
  .crumbs .sep { color: #b7c3d2; }
  .crumbs .here { color: var(--text-primary); font-weight: 500; }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 0 20px 12px;
    align-items: center;
  }
  .search {
    flex: 1;
    min-height: 30px;
    padding: 0 10px;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-md);
    background: var(--app-bg);
    font-size: 13px;
    font-family: inherit;
    color: var(--text-primary);
    outline: none;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .search:focus { border-color: var(--brand); background: #fff; }
  .search::placeholder { color: #9aa7b5; }

  .btn {
    min-height: 30px;
    padding: 0 12px;
    border: 0;
    border-radius: var(--radius-md);
    background: var(--app-bg);
    color: #354a61;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, transform 120ms ease;
    white-space: nowrap;
  }
  .btn:hover { background: #eaf3ff; color: var(--brand); }
  .btn:active { transform: scale(0.92); }
  .btn:disabled { color: #9aa7b5; background: transparent; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:not(:disabled):hover { background: #0f5fd8; color: #fff; }
  .btn.primary:disabled { background: #dfe6ef; color: #9aa7b5; }

  .seg {
    display: inline-flex;
    gap: 2px;
    padding: 4px;
    background: var(--app-bg);
    border-radius: var(--radius-md);
  }
  .seg button {
    min-height: 22px;
    padding: 0 12px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #354a61;
    font-size: 13px;
    font-weight: 650;
    line-height: 1;
    cursor: pointer;
    appearance: none;
    white-space: nowrap;
    transition: background-color 140ms ease, color 140ms ease;
  }
  .seg button:hover { background: #eaf3ff; color: #1677ff; }
  .seg button.active { background: #dceeff; color: #1264d8; }
  .seg button.active:hover { background: #cde5ff; }
  .seg button:focus-visible { outline: 0; background: #dceeff; color: #1264d8; }

  .list-head {
    display: grid;
    grid-template-columns: 44px minmax(240px, 1fr) 120px;
    align-items: center;
    gap: 4px;
    position: sticky;
    top: 0;
    z-index: 2;
    margin: 0 -20px;
    padding: 7px 28px;
    background: #edf2f8;
    box-shadow: 0 1px 0 #dde5ef;
    font-size: 12px;
    color: #687b91;
  }
  .list-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-gutter: stable;
    overscroll-behavior: contain;
    padding: 0 20px 12px;
  }
  #body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 4px;
  }

  .row {
    display: grid;
    grid-template-columns: 44px minmax(240px, 1fr) 120px;
    align-items: center;
    gap: 4px;
    min-height: 39px;
    padding: 0 8px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #354a61;
    font-size: 13px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, transform 120ms ease;
  }
  .row:hover { background: #eaf2fb; }
  .row:active { transform: scale(0.99); }
  .row.selected { color: #163f6c; background: #d9eaff; }
  .row.selected:hover, .row.focused { background: #cfe4ff; }
  .row.unavailable { color: #9aa7b5; cursor: not-allowed; }
  .row.unavailable:hover { background: transparent; }

  .kind {
    display: flex;
    align-items: center;
    color: #8b9cae;
  }
  .kind svg { width: 16px; height: 16px; display: block; }
  .row.selected .kind { color: #1264d8; }
  .row.unavailable .kind { color: #b6c2ce; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; color: #8998a9; text-align: right; }
  .row.selected .tag { color: #163f6c; }

  .empty {
    min-height: 220px;
    display: grid;
    place-items: center;
    color: #91a0b0;
    font-size: 13px;
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 58px;
    padding: 0 20px;
    border-top: 1px solid var(--panel-border);
    background: #fbfcfe;
  }
  .status { display: flex; flex-direction: column; gap: 2px; }
  .status strong { font-size: 12px; font-weight: 600; color: #334a63; }
  .status span { font-size: 11px; color: #8998a9; }
  .actions { display: flex; gap: 8px; }
  .actions .btn { min-width: 88px; min-height: 38px; }

  .error {
    margin: 0 20px 12px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    background: var(--danger-soft);
    color: #b42318;
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <div class="title">选择要执行的剧情</div>
      <div class="count" id="count">读取中…</div>
    </div>

    <div class="crumbs">
      <span>目录</span>
      <span class="sep">/</span>
      <span class="here" id="cwd">process</span>
    </div>

    <div class="toolbar">
      <div class="seg" role="radiogroup" aria-label="列表筛选">
        <button type="button" role="radio" aria-checked="false" data-seg="all">全部</button>
        <button type="button" class="active" role="radio" aria-checked="true" data-seg="run">可执行</button>
      </div>
      <input class="search" id="search" type="text" placeholder="筛选剧情或文件名">
      <button class="btn" id="btnUp">返回上级</button>
      <button class="btn" id="btnRefresh">重新读取</button>
    </div>

    <div id="errorBox"></div>

    <div class="list-wrap">
      <div class="list-head">
        <span>类型</span>
        <span>名称</span>
        <span style="text-align:right">状态</span>
      </div>
      <div id="body"></div>
    </div>

    <div class="foot">
      <div class="status">
        <strong id="pickedText">未选择剧情</strong>
        <span id="hintText">默认列出全部可执行剧情，切到「全部」可进目录翻文件</span>
      </div>
      <div class="actions">
        <button class="btn" id="btnCancel">取消</button>
        <button class="btn primary" id="btnGo" disabled>开始执行</button>
      </div>
    </div>
  </div>

<script>
(function () {
  var state = { cwd: "process", upTo: null, folders: [], files: [], processes: [], picked: null, query: "", segment: "run" };

  var elBody = document.getElementById("body");
  var elCwd = document.getElementById("cwd");
  var elCount = document.getElementById("count");
  var elPicked = document.getElementById("pickedText");
  var elError = document.getElementById("errorBox");
  var elGo = document.getElementById("btnGo");
  var elUp = document.getElementById("btnUp");
  var elSearch = document.getElementById("search");
  var elCancel = document.getElementById("btnCancel");

  function post(url, data) {
    window.chrome.webview.postMessage(JSON.stringify({ url: url, data: data || {} }));
  }

  function matches(text) {
    if (!state.query) return true;
    return String(text).toLowerCase().indexOf(state.query.toLowerCase()) !== -1;
  }

  var ICONS = {
    folder: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 4.3c0-.7.55-1.25 1.25-1.25h2.5c.4 0 .78.19 1.02.51l.86 1.14h4.1c.7 0 1.25.56 1.25 1.25v5.74c0 .7-.55 1.25-1.25 1.25H3.45c-.7 0-1.25-.56-1.25-1.25V4.3z"/></svg>',
    file: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.95 3.3c0-.7.55-1.25 1.25-1.25h3.35L11.8 5.6v7.15c0 .7-.55 1.25-1.25 1.25H5.2c-.7 0-1.25-.56-1.25-1.25V3.3z"/><path d="M8.55 2.05V5.6H11.8"/></svg>',
    story: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.05"/><path d="M6.65 5.5 10.6 8l-3.95 2.5V5.5z" fill="currentColor" stroke="none"/></svg>'
  };
  var ICON_LABEL = { folder: "目录", file: "文件", story: "剧情" };

  function makeRow(iconKey, name, tag, opts) {
    var row = document.createElement("button");
    row.type = "button";
    row.className = "row" + (opts.selected ? " selected" : "") + (opts.enabled ? "" : " unavailable");
    row.setAttribute("role", opts.enabled ? "option" : "presentation");
    row.setAttribute("aria-selected", opts.selected ? "true" : "false");

    var a = document.createElement("span");
    a.className = "kind";
    a.innerHTML = ICONS[iconKey] || ICONS.file;
    a.title = ICON_LABEL[iconKey] || "";
    var b = document.createElement("span");
    b.className = "name";
    b.textContent = name;
    b.title = name;
    var c = document.createElement("span");
    c.className = "tag";
    c.textContent = tag;

    row.appendChild(a); row.appendChild(b); row.appendChild(c);
    if (opts.enabled) row.addEventListener("click", opts.onClick);
    return row;
  }

  function showEmpty(text) {
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = text;
    elBody.appendChild(empty);
  }

  function render() {
    elCwd.textContent = state.cwd;
    elBody.innerHTML = "";

    if (state.segment === "run") {
      elUp.disabled = true;
      elCount.textContent = "共 " + state.processes.length + " 个可用剧情";

      var stories = state.processes.filter(function (p) { return matches(p.name); });
      if (!stories.length) {
        showEmpty(state.query ? "没有匹配项" : "process 目录下没有找到可执行剧情");
        return;
      }
      stories.forEach(function (p) {
        elBody.appendChild(makeRow("story", p.name, "process.json", {
          selected: state.picked && state.picked.path === p.path,
          enabled: true,
          onClick: function () { pick(p, p.name); }
        }));
      });
      return;
    }

    elUp.disabled = state.cwd === "process" || !state.upTo;
    elCount.textContent = "当前目录 " + (state.folders.length + state.files.length) + " 项";

    var folders = state.folders.filter(function (f) { return matches(f.name); });
    var files = state.files.filter(function (f) { return matches(f.name); });

    if (!folders.length && !files.length) {
      showEmpty(state.query ? "没有匹配项" : "当前目录是空的");
      return;
    }

    folders.forEach(function (f) {
      elBody.appendChild(makeRow("folder", f.name, "进入", {
        selected: false,
        enabled: true,
        onClick: function () { post("/picker/enter", { path: f.path }); }
      }));
    });

    files.forEach(function (f) {
      var name = f.selectable ? (f.label || f.name) : f.name;
      elBody.appendChild(makeRow(f.selectable ? "story" : "file", name, f.selectable ? "可执行" : "不可执行", {
        selected: state.picked && state.picked.path === f.path,
        enabled: f.selectable,
        onClick: function () { pick(f, name); }
      }));
    });
  }

  function pick(file, name) {
    state.picked = { path: file.path, name: name };
    elPicked.textContent = "已选择：" + name;
    elGo.disabled = false;
    render();
  }

  function showError(message) {
    elError.innerHTML = "";
    var box = document.createElement("div");
    box.className = "error";
    box.textContent = message;
    elError.appendChild(box);
  }

  window.htmlMask.onMessage = function (msg) {
    if (!msg || msg.url !== "/picker/state") return;

    var payload = msg.data || {};
    elError.innerHTML = "";
    if (!payload.ok) {
      elCount.textContent = "读取失败";
      showError("读取目录失败：" + (payload.error || "未知错误"));
      return;
    }

    var view = payload.view || {};
    state.cwd = view.cwd || "process";
    state.upTo = view.upTo || null;
    state.folders = view.folders || [];
    state.files = view.files || [];
    state.processes = payload.processes || [];

    var stillThere = state.picked && (state.processes.concat(state.files).some(function (f) {
      return f.path === state.picked.path;
    }));
    if (state.picked && !stillThere) {
      state.picked = null;
      elPicked.textContent = "未选择剧情";
      elGo.disabled = true;
    }
    render();
  };

  elGo.addEventListener("click", function () {
    if (!state.picked) return;
    post("/picker/choose", { path: state.picked.path, name: state.picked.name });
    elPicked.textContent = "已提交，正在启动…";
    elGo.disabled = true;
  });

  elCancel.addEventListener("click", function () {
    post("/picker/cancel");
  });

  document.getElementById("btnRefresh").addEventListener("click", function () {
    post("/picker/refresh", { path: state.cwd });
    elCount.textContent = "重新读取中…";
  });

  elUp.addEventListener("click", function () {
    if (state.upTo) post("/picker/up", { path: state.upTo });
  });

  elSearch.addEventListener("input", function () {
    state.query = elSearch.value.trim();
    render();
  });

  var segButtons = [].slice.call(document.querySelectorAll(".seg button"));
  segButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.segment = btn.getAttribute("data-seg");
      segButtons.forEach(function (other) {
        var on = other === btn;
        other.classList.toggle("active", on);
        other.setAttribute("aria-checked", on ? "true" : "false");
      });
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
